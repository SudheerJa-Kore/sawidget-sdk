apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdkVersion 35

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }

    dataBinding {
        enabled = true
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace "com.kore.ai.widgetsdk"
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.jakewharton.retrofit:retrofit2-rxjava2-adapter:1.0.0'
    implementation 'de.greenrobot:eventbus:2.4.1'
    implementation 'com.eftimoff:android-pathview:1.0.8@aar'
    implementation 'com.makeramen:roundedimageview:2.2.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.2.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'android.arch.lifecycle:extensions:1.1.1'
    implementation 'android.arch.persistence.room:runtime:1.1.1'
//    implementation project(':MPAndroidChart-3.1.0')
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'com.github.cachapa:ExpandableLayout:2.9.2'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = providers.gradleProperty('group').orElse('com.github.SudheerJa-Kore').get()
                artifactId = 'sawidget-sdk'
                version = providers.gradleProperty('version').orElse('0.1.0').get()
                from components.release
            }
        }
    }
}
